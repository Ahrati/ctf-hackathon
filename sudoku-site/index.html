<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <style>
    :root { color-scheme: dark; --bg:#10151d; --panel:#19222e; --text:#eef3fa; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; display:flex; justify-content:center; padding:28px 14px; }
    main { width:min(100%,620px); }
    .panel { background:var(--panel); border:1px solid #2c394a; border-radius:16px; padding:clamp(10px,3vw,22px); }
    table { border-collapse:collapse; table-layout:fixed; width:100%; aspect-ratio:1; background:#f5f7fb; color:#15202d; border:3px solid #15202d; }
    td { width:11.111%; height:11.111%; text-align:center; vertical-align:middle; border:1px solid #aab4c2; font-size:clamp(1rem,5.5vw,2rem); font-weight:550; }
    td.box-right { border-right:3px solid #15202d; }
    td.box-bottom { border-bottom:3px solid #15202d; }
    td.center { background:#e4f5f1; }
    td.ring { box-shadow:inset 0 0 0 2px #73bfb1; background:#e4f5f1; }
  </style>
</head>
<body>
<main>
  <section class="panel" aria-label="Sudoku puzzle">
    <table aria-label="9 by 9 Sudoku grid">
      <tbody>
      <tr><td class="">8</td><td class="">&nbsp;</td><td class="box-right">&nbsp;</td><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">9</td><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="">&nbsp;</td></tr>
      <tr><td class="">&nbsp;</td><td class="">9</td><td class="box-right">&nbsp;</td><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">&nbsp;</td><td class="">&nbsp;</td><td class="">7</td><td class="">5</td></tr>
      <tr><td class="box-bottom">3</td><td class="box-bottom">5</td><td class="box-right box-bottom ring">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-bottom ring">&nbsp;</td><td class="box-right box-bottom">&nbsp;</td><td class="box-bottom ring">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-bottom">1</td></tr>
      <tr><td class="">&nbsp;</td><td class="">1</td><td class="box-right">&nbsp;</td><td class="">&nbsp;</td><td class="">8</td><td class="box-right">2</td><td class="">&nbsp;</td><td class="">6</td><td class="">&nbsp;</td></tr>
      <tr><td class="">&nbsp;</td><td class="">2</td><td class="box-right ring">&nbsp;</td><td class="">&nbsp;</td><td class="">1</td><td class="box-right">6</td><td class="ring">&nbsp;</td><td class="">&nbsp;</td><td class="">9</td></tr>
      <tr><td class="box-bottom">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-right box-bottom">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-right box-bottom">4</td><td class="box-bottom">&nbsp;</td><td class="box-bottom">&nbsp;</td><td class="box-bottom">&nbsp;</td></tr>
      <tr><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right ring">6</td><td class="">&nbsp;</td><td class="ring">7</td><td class="box-right">&nbsp;</td><td class="ring">3</td><td class="">9</td><td class="">8</td></tr>
      <tr><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">&nbsp;</td><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">&nbsp;</td><td class="">7</td><td class="">&nbsp;</td><td class="">&nbsp;</td></tr>
      <tr><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">3</td><td class="">&nbsp;</td><td class="">&nbsp;</td><td class="box-right">&nbsp;</td><td class="">5</td><td class="">2</td><td class="">6</td></tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
