<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Event · Sign in</title><link rel="stylesheet" href="/css/style.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="brand-mark">CTF<span> / EVENT</span></div>
    <p class="eyebrow">TEAM ACCESS</p>
    <h1>Ready when you are.</h1>
    <p class="muted">Sign in with your team's shared credentials to access the challenges.</p>
    <form id="login-form" class="panel login-form">
      <label for="username">Team username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="191" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
      <button class="button primary full" type="submit">Sign in <span aria-hidden="true">→</span></button>
      <p id="login-message" class="form-message" role="status"></p>
    </form>
    <p class="footer-note">Need access? Ask an event administrator for your team's credentials.</p>
  </main>
</body>
</html>
