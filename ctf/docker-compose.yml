services:
  db:
    image: mariadb:10.11
    container_name: DB_Container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
    volumes:
      - .data/mysql:/var/lib/mysql
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  ctfd:
    image: ctfd/ctfd:latest
    container_name: CTFd_Container
    restart: unless-stopped
    # CTFd's own UI is host-local only; the Bun app accesses it via Docker's internal network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY:?Set CTFD_SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .data/CTFd/logs:/opt/CTFd/CTFd/logs
      - .data/CTFd/uploads:/var/uploads

  app:
    build: ./app
    container_name: AppContainer
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/app/backups
      # Serve static assets straight from the host so CSS/HTML/JS edits take effect without rebuilding.
      - ./app/public:/usr/src/app/public:ro
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      SESSION_DAYS: ${SESSION_DAYS:-12}
      CTFD_URL: ${CTFD_URL:-http://ctfd:8000}
      CTFD_TOKEN: ${CTFD_TOKEN:-}
      CTFD_TEAM_TOKENS_JSON: ${CTFD_TEAM_TOKENS_JSON:-}
      CTFD_CHALLENGE_IDS_JSON: ${CTFD_CHALLENGE_IDS_JSON:-}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
      ctfd:
        condition: service_started
