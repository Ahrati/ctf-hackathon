services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd_root_password
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd_password
      - MYSQL_DATABASE=ctfd
    volumes:
      - .data/mysql:/var/lib/mysql
    command: [
      mysqld,
      --character-set-server=utf8mb4,
      --collation-server=utf8mb4_unicode_ci,
      --wait_timeout=28800,
      --log-warnings=0
    ]

  ctfd:
    image: ctfd/ctfd:latest
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=554540e7516e02c7e0c5bae21a1d9bea83bc5a0c35cfd20074edadf4507e99bf
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd_password@db/ctfd
    depends_on:
      - db
    volumes:
      - .data/CTFd/logs:/opt/CTFd/CTFd/logs
      - .data/CTFd/uploads:/var/uploads

  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CTFD_URL=http://ctfd:8000
      - CTFD_TOKEN=ctfd_c18dde2253a725851d6dfa97d16d496fe466a0086e969b643373d40d0e504e40
      - DATABASE_URL=mysql://ctfd:ctfd_password@db:3306/ctfd
    depends_on:
      - db
      - ctfd
